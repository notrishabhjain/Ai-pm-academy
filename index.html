<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI PM Academy — learn AI from zero to confident AI Project / Program Manager with interactive, visual, zero-backend labs." />
    <meta name="theme-color" content="#4f46e5" />
    <title>AI PM Academy</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('ai-pm-academy:v1') || '{}');
        var t = s && s.settings && s.settings.theme;
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
